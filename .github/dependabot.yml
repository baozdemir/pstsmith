version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Only patch updates are grouped: a minor or major update of a 0.x crate can break the build or change output
    # bytes, so each comes as its own pull request with its own CI run.
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # The output bytes follow the MIME parser: its breaking releases are taken by hand, with the fixtures and the
      # libpff oracle.
      - dependency-name: "mail-parser"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Used only by the example browse_pst, a terminal viewer.
      - dependency-name: "ratatui"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /packages/pstsmith-node
    schedule:
      interval: weekly
    ignore:
      # The platform packages are this project's own, released with it.
      - dependency-name: "@pstsmith/*"
      # A new major of the Node.js types is taken by hand, with the Node.js versions the package supports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A new major of the compiler is taken by hand: it changes the published JavaScript and declarations.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
