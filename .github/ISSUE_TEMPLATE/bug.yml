name: Bug report
description: pstsmith wrote a wrong file, refused a valid input, or crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach real mail.** PST, EML and MBOX files hold private messages. Describe the input, or attach a
        synthetic file that shows the problem (addresses in `example.invalid`).
  - type: input
    id: version
    attributes:
      label: pstsmith version
      description: "`pstsmith --version`, or the crate version"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "Ubuntu 24.04 x86-64, macOS 15 arm64, Windows 11 x86-64"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The command or the library call, and what the input was (EML, MBOX from which program, Maildir, manifest).
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: The output, the error line, and what Outlook, SCANPST or another reader showed (with its version).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I attached no real mail.
          required: true
