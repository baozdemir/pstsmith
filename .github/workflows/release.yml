# The binaries of a release vX.Y.Z whose GitHub release is still a draft: built from the tag for every target, each
# archive attested (build provenance) and attached to the draft, which is then published (an immutable release takes
# no assets once published); then the npm packages and, when the maintainer has set the HOMEBREW_TAP_TOKEN secret,
# the Homebrew formula in baozdemir/homebrew-tap. Called only by release-plz.yml (also for the first release), so npm's
# trusted publishing sees one calling workflow.
name: Release binaries

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, vX.Y.Z, whose draft release receives the archives
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Resolve the tag
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tag, not a branch of the same name; a release tag on main only.
      - id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG"; exit 1; }
          sha=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}") || { echo "no tag $TAG"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "$TAG is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, musl: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm, musl: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: ${{ matrix.musl }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p pstsmith-cli --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="pstsmith-$TARGET"
          mkdir -p "dist/$name"
          exe=pstsmith; [ "${TARGET#*windows}" != "$TARGET" ] && exe=pstsmith.exe
          cp "target/$TARGET/release/$exe" LICENSE README.md "dist/$name/"
          cd dist
          if [ "$exe" = pstsmith.exe ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: Attest and attach
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pstsmith-*
      - name: Attach to the draft release, then publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "the release $TAG is not a draft; a published release takes no assets"; exit 1
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  npm:
    name: npm packages
    needs: [tag, publish]
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later (docs.npmjs.com/trusted-publishers).
      - name: npm 11.5.1 or later
        run: |
          current=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n 1)" != 11.5.1 ]; then npm install -g npm@11.5.1; fi
          npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true
      # npm tries trusted publishing (OIDC) first and falls back to a token: NPM_TOKEN, an environment secret of
      # `release`, is needed only for the first publish of a package, before its trusted publisher can be set.
      - name: Platform packages
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${TAG#v}"
          mkdir binaries
          for archive in archives/*; do
            target=$(basename "$archive"); target="${target#pstsmith-}"; target="${target%.tar.gz}"; target="${target%.zip}"
            mkdir -p "binaries/$target"
            case "$archive" in
              *.zip) unzip -j -o "$archive" "*/pstsmith.exe" -d "binaries/$target" ;;
              *) tar xzf "$archive" -C "binaries/$target" --strip-components=1 "pstsmith-$target/pstsmith" ;;
            esac
          done
          node packages/pstsmith-node/platform-packages.mjs "$version" binaries npm-platforms
          for dir in npm-platforms/*; do (cd "$dir" && npm publish --provenance --access public); done
      - name: The pstsmith package
        working-directory: packages/pstsmith-node
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${TAG#v}"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.version=process.argv[1];for(const k of Object.keys(p.optionalDependencies))p.optionalDependencies[k]=process.argv[1];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")' "$version"
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
          npm publish --provenance --access public

  homebrew:
    name: Homebrew formula
    needs: [tag, publish]
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Update baozdemir/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN is not set; skipping the formula"; exit 0; fi
          sh .github/homebrew-formula.sh "$TAG" dist > pstsmith.rb
          git clone "https://x-access-token:$TAP_TOKEN@github.com/baozdemir/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp pstsmith.rb tap/Formula/pstsmith.rb
          cd tap
          git config user.name "pstsmith release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pstsmith.rb
          git commit -m "pstsmith $TAG" && git push
