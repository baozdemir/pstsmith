# Every push to main and every pull request: tests and fixture byte identity on Linux, macOS and Windows, the minimum
# supported Rust version, lints, documentation, dependency checks, the libpff oracle and the npm package.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Write the generated fixture
        run: python tests/fixtures/generate.py
      - name: Tests, including fixture byte identity
        run: cargo test --workspace --release --locked

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.88"
      - name: Build the library and the command line
        run: cargo build --locked -p pstsmith -p pstsmith-cli

  lint:
    name: Format, lints, documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: Dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  oracle:
    name: libpff oracle and structure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install libpff-python==20260926
      - run: cargo build --workspace --release --locked
      - name: libpff readback against Python's email reading of the sources
        run: python tests/oracle/compare_mail.py target/release/pstsmith
      - name: The negative control must find mismatches
        run: python tests/oracle/compare_mail.py target/release/pstsmith --negative-control
      - name: Reference counts, allocation map and tables of every mail fixture's output
        shell: bash
        run: |
          mkdir -p out
          for case in "eml:mail/eml" "takeout:mail/takeout/All mail Including Spam and Trash.mbox" \
                      "thunderbird:mail/thunderbird/Local Folders" "apple:mail/apple/Export" \
                      "applemailbox:mail/apple/Export/Clients.mbox" "applefile:mail/apple/Export/Clients.mbox/mbox" \
                      "crlf:mail/crlf/Windows.mbox" "maildir:mail/maildir/Maildir"; do
            target/release/pstsmith convert "tests/fixtures/${case#*:}" -o "out/${case%%:*}.pst"
          done
          sh tests/oracle/structure.sh out/*.pst
      - run: python tests/oracle/report_reference.py

  node:
    name: npm package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: cargo build --release --locked -p pstsmith-cli
      - name: Build and test
        working-directory: packages/pstsmith-node
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
          npm test
