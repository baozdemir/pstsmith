# cargo-deny: dependency licences, advisories, duplicate crates and sources (https://embarkstudios.github.io/cargo-deny/).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained and has no successor release; it reaches only the examples' terminal UI (ratatui, a
    # dev-dependency of the pstsmith crate) and is in no published crate's dependencies.
    { id = "RUSTSEC-2024-0436", reason = "dev-dependency of the examples only (ratatui); not in any published crate" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
