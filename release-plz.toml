# release-plz: a release pull request per change set, then the crates.io publish, the tag and the GitHub release.
[workspace]
repo_url = "https://github.com/baozdemir/pstsmith"
semver_check = true

# The library and the command line share one version and one tag, vX.Y.Z. Its GitHub release is created as a draft:
# release.yml attaches the archives and then publishes it (an immutable release takes no assets once published).
[[package]]
name = "pstsmith"
changelog_path = "CHANGELOG.md"
version_group = "pstsmith"
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_draft = true

[[package]]
name = "pstsmith-cli"
changelog_path = "crates/pstsmith-cli/CHANGELOG.md"
version_group = "pstsmith"
git_tag_enable = false
git_release_enable = false

[[package]]
name = "pstsmith-check"
release = false

[[package]]
name = "compressed-rtf"
release = false
