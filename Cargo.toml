[workspace]
members = ["crates/compressed-rtf", "crates/pstsmith", "crates/pstsmith-check", "crates/pstsmith-cli"]
resolver = "2"

[patch.crates-io]
compressed-rtf = { path = "crates/compressed-rtf" }

[workspace.package]
authors = ["The pstsmith contributors"]
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/baozdemir/pstsmith"
homepage = "https://github.com/baozdemir/pstsmith"
license = "MIT"

[workspace.dependencies]
compressed-rtf = "1"

anyhow = "1"
byteorder = "1"
clap = { version = "4", features = ["derive"] }
codepage-strings = "1"
crossterm = "0.29"
ratatui = "0.30"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
