[package]
name = "pstsmith-cli"
description = "Convert mail to PST files: the pstsmith command line"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
license.workspace = true
keywords = ["pst", "email", "eml", "mbox", "outlook"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "pstsmith"
path = "src/main.rs"
# The library's documentation is the pstsmith crate's; the binary's would take the same path.
doc = false

[dependencies]
pstsmith = { path = "../pstsmith", version = "0.1.0" }
signal-hook = { version = "0.4.6", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[features]
# Tests only: `--max-file-bytes N` sets any file size limit; release builds take the four choices of `--max-file-size`.
test-file-sizes = []
# Maintainer diagnostics, see the pstsmith crate.
mem-profile = ["pstsmith/mem-profile"]
op-counters = ["pstsmith/op-counters"]

[dev-dependencies]
serde_json = "1"

# cargo-binstall: the release archives are pstsmith-<target>.tar.gz (zip on Windows), holding pstsmith-<target>/pstsmith.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pstsmith-{ target }{ archive-suffix }"
bin-dir = "pstsmith-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
